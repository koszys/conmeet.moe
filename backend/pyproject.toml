[project]
name = "conmeet-backend"
version = "0.1.0"
description = "conmeet.moe API - freebies, meetups, and schedules for convention goers"
requires-python = ">=3.14"
dependencies = [
    "django==6.1.*",
    "djangorestframework>=3.16.0",
    "djangorestframework-simplejwt>=5.4.0",
    "django-allauth>=65.0.0",
    "django-cors-headers>=4.6.0",
    "django-storages[boto3]>=1.14.5",
    "Pillow>=11.0.0",
    "django-imagekit>=6.1.0",
    "psycopg[binary]>=3.2.0",
    "django-environ>=0.11.2",
    "whitenoise>=6.8.0",
    "redis>=5.2.0",
    "uvicorn[standard]>=0.34.0",
    "gunicorn>=23.0.0",
    "django-quill-editor>=0.1.42",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "factory-boy>=3.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "django-stubs>=5.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["config"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
